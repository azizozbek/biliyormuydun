baseURL = "https://example.com/"  # overridden by HUGO_BASEURL in .env (see .env.example)
locale = "tr-TR"
defaultContentLanguage = "tr"
title = "Biliyor muydun?"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  description = "Her kaydırmada yeni bir genel kültür bilgisi. Tarih, uzay, hayvanlar, bilim ve daha fazlası; internet olmadan da çalışır."

[mediaTypes."application/manifest+json"]
  suffixes = ["webmanifest"]

[outputFormats.manifest]
  mediaType = "application/manifest+json"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

[outputFormats.sw]
  mediaType = "text/javascript"
  baseName = "sw"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "manifest", "sw"]
  section = ["html"]
  page = ["html"]

[sitemap]
  changeFreq = "monthly"
