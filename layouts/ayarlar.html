{{ define "main" }}
<div class="page">
  <header class="page-head">
    <a class="icon" href="/" aria-label="Kartlara dön">{{ partial "icon.html" "left" }}</a>
    <h1>{{ .Title }}</h1>
  </header>
  <form class="settings" id="settings">
    <fieldset>
      <legend>Tema</legend>
      <div class="seg">
        <input type="radio" name="theme" id="t-system" value="system"><label for="t-system">Sistem</label>
        <input type="radio" name="theme" id="t-light" value="light"><label for="t-light">Açık</label>
        <input type="radio" name="theme" id="t-dark" value="dark"><label for="t-dark">Koyu</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Yazı boyutu</legend>
      <div class="seg sizes">
        <input type="radio" name="size" id="s-S" value="S"><label for="s-S" aria-label="Küçük">A</label>
        <input type="radio" name="size" id="s-M" value="M"><label for="s-M" aria-label="Orta">A</label>
        <input type="radio" name="size" id="s-L" value="L"><label for="s-L" aria-label="Büyük">A</label>
        <input type="radio" name="size" id="s-XL" value="XL"><label for="s-XL" aria-label="Çok büyük">A</label>
      </div>
      <p class="preview" data-c="0">Bal, pratikte hiç bozulmaz.</p>
    </fieldset>
  </form>
  <section class="offline-info" aria-labelledby="off-title">
    <h2 id="off-title" class="legend">Çevrimdışı</h2>
    <p class="status-row">{{ partial "icon.html" "check" }}<span id="offline-status">Kontrol ediliyor…</span></p>
    <button class="btn-primary" type="button" id="install" hidden>Ana ekrana ekle</button>
    <button class="btn-secondary" type="button" id="reset-seen">Gördüğüm bilgileri sıfırla</button>
  </section>
</div>
{{ end }}
